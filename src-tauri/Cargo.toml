[package]
name = "iphone-ai"
version = "0.5.0"
description = "iPhone AI desktop shell: starts the bundled Node.js backend and hosts its UI."
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# No plugins: the window only loads the local backend and never gets IPC commands.
tauri = { version = "2.12", features = [] }
serde_json = "1"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Build scripts and proc-macros are dlopen'ed by rustc on this Mac. On macOS 27
# a stripped proc-macro dylib fails dyld's LINKEDIT alignment check ("can't
# find crate"), so only the shipped binary is stripped.
[profile.release.build-override]
strip = false
